services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - dick

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: php-fpm
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - dick

  db:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: jopa
      MYSQL_ROOT_PASSWORD: "1111"
      MYSQL_PASSWORD: "1111"
      MYSQL_USER: user
    networks:
      - dick

networks:
  dick:
    driver: bridge

volumes:
  mysql_data:
    driver: local



